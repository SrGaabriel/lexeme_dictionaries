name: dictionaries

on:
  workflow_dispatch:
    inputs:
      languages:
        required: false
        default: ""
      tag:
        required: false
        default: "dicts-v1"
      publish:
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: dictionaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustc --version && cargo --version
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tool
          path: target/release/lexeme_dictionaries
          retention-days: 1

  plan:
    needs: tool
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      generated: ${{ steps.plan.outputs.generated }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tool
      - run: chmod +x lexeme_dictionaries

      - id: plan
        run: |
          set -euo pipefail
          ./lexeme_dictionaries matrix --only "${{ inputs.languages }}" > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "generated=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          jq . matrix.json

      - name: Check every source URL resolves
        run: |
          set -euo pipefail
          failed=0
          for url in $(jq -r '.include[].url' matrix.json); do
            code=$(curl -sI -o /dev/null -w '%{http_code}' --retry 2 --max-time 30 "$url")
            printf '%s  %s\n' "$code" "$url"
            [ "$code" = "200" ] || failed=1
          done
          [ "$failed" = "0" ] || { echo "::error::some sources are unreachable"; exit 1; }

  build:
    needs: [tool, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tool
      - run: chmod +x lexeme_dictionaries

      - name: Compile ${{ matrix.name }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
               --retry 5 --retry-delay 15 --retry-all-errors \
               --user-agent "lexeme-dictionaries (+https://github.com/${{ github.repository }})" \
               "${{ matrix.url }}" \
          | ./lexeme_dictionaries build \
              --lang "${{ matrix.code }}" \
              --name "${{ matrix.name }}" \
              --source "${{ matrix.url }}" \
              --license "${{ matrix.license }}" \
              --generated "${{ needs.plan.outputs.generated }}" \
              --out "dist/${{ matrix.code }}.lex.zst" \
              --stats "dist/${{ matrix.code }}.stats.json"
          jq . "dist/${{ matrix.code }}.stats.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.code }}
          path: dist/
          retention-days: 7

  publish:
    needs: [tool, plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tool
      - run: chmod +x lexeme_dictionaries
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Assemble manifest
        run: |
          set -euo pipefail
          ./lexeme_dictionaries manifest \
            --dist dist \
            --tag "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --generated "${{ needs.plan.outputs.generated }}"
          ls -lh dist/
          jq . dist/manifest.json

      - name: Publish release assets
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Dictionaries ($tag)" \
              --notes-file dist/NOTICE.md
          fi
          gh release upload "$tag" dist/* --clobber
