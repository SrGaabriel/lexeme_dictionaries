[package]
name = "lexeme_dictionaries"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
zstd = "0.14"
lexeme = { git = "https://github.com/SrGaabriel/lexeme" }
sha2 = "0.10"
toml = "0.9"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
